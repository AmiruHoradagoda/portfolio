<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Reliable Booking Flow</title><desc id="desc">Safe retries, atomic inventory reservation, and explicit recovery after partial failures</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#67e8f9"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#e2e8f0;font-size:24px} .title{font-size:38px;font-weight:700;fill:#f8fafc}.sub{fill:#94a3b8;font-size:23px}.label{font-size:21px;fill:#67e8f9;font-weight:700}.heading{font-weight:700;fill:#f8fafc}.edge{fill:none;stroke:#67e8f9;stroke-width:2.5;stroke-linejoin:round;marker-end:url(#arrow)}.dash{stroke-dasharray:7 6}</style>
<rect width="1600" height="900" rx="24" fill="#080d24"/>
<text x="60" y="65" class="title">Reliable Booking Flow</text><text x="60" y="105" class="sub">Safe retries, atomic inventory reservation, and explicit recovery after partial failures</text>
<text x="60" y="145" class="label">REQUEST &amp; RESERVATION</text>
<text x="580" y="145" class="label">RETRY &amp; FAILURE BRANCHES</text>
<text x="1100" y="145" class="label">COMMIT &amp; ASYNC WORK</text>
<rect x="60" y="170" width="440" height="110" rx="14" fill="#101d38" stroke="#36537c" stroke-width="2"/>
<text x="80" y="203" class="heading">Customer · POST /bookings</text>
<text x="80" y="233">JWT + Idempotency-Key</text>
<text x="80" y="263">Correlation ID</text>
<path d="M280 280V315" class="edge"/>
<rect x="60" y="315" width="440" height="95" rx="14" fill="#12304a" stroke="#22d3ee" stroke-width="2"/>
<text x="80" y="355.5" class="heading">Booking Service</text>
<text x="80" y="385.5">Check key + request fingerprint</text>
<path d="M280 410V455" class="edge"/>
<rect x="60" y="455" width="440" height="65" rx="14" fill="#101d38" stroke="#36537c" stroke-width="2"/>
<text x="80" y="495.5" class="heading">Validate event / ticket selection</text>
<path d="M280 520V560" class="edge"/>
<rect x="60" y="560" width="440" height="95" rx="14" fill="#12304a" stroke="#22d3ee" stroke-width="2"/>
<text x="80" y="600.5" class="heading">Event Service</text>
<text x="80" y="630.5">Concurrency-safe reservation</text>
<path d="M280 655V710" class="edge"/>
<rect x="60" y="710" width="440" height="65" rx="14" fill="#101d38" stroke="#36537c" stroke-width="2"/>
<text x="80" y="750.5" class="heading">Payment</text>
<path d="M500 345H580" class="edge"/>
<rect x="580" y="285" width="440" height="115" rx="14" fill="#101d38" stroke="#36537c" stroke-width="2"/>
<text x="600" y="320.5" class="heading">Same key + same body</text>
<text x="600" y="350.5">Return existing booking</text>
<text x="600" y="380.5">No second stock deduction</text>
<path d="M500 380H545V475H580" class="edge"/>
<rect x="580" y="440" width="440" height="70" rx="14" fill="#101d38" stroke="#36537c" stroke-width="2"/>
<text x="600" y="483" class="heading">Same key + different body → 409</text>
<path d="M500 742H580" class="edge"/>
<rect x="580" y="645" width="440" height="145" rx="14" fill="#101d38" stroke="#36537c" stroke-width="2"/>
<text x="600" y="680.5" class="heading">Payment fails → release inventory</text>
<text x="600" y="710.5">Release failure → recovery state</text>
<text x="600" y="740.5">Reservation-expiry worker</text>
<text x="600" y="770.5">retries later</text>
<rect x="1100" y="170" width="440" height="150" rx="14" fill="#12304a" stroke="#22d3ee" stroke-width="2"/>
<text x="1120" y="223" class="heading">Persist together:</text>
<text x="1120" y="253">Booking + Payment</text>
<text x="1120" y="283">IdempotencyRecord + OutboxEvent</text>
<path d="M280 775V825H1060V245H1100" class="edge"/>
<text x="565" y="855" class="label">Payment succeeds → persist booking transaction</text>
<path d="M1320 320V365" class="edge"/>
<rect x="1100" y="365" width="440" height="65" rx="14" fill="#101d38" stroke="#36537c" stroke-width="2"/>
<text x="1120" y="405.5" class="heading">Commit</text>
<path d="M1320 430V475" class="edge"/>
<rect x="1100" y="475" width="440" height="65" rx="14" fill="#101d38" stroke="#36537c" stroke-width="2"/>
<text x="1120" y="515.5" class="heading">Outbox Worker</text>
<path d="M1320 540V585" class="edge"/>
<rect x="1100" y="585" width="440" height="65" rx="14" fill="#12304a" stroke="#22d3ee" stroke-width="2"/>
<text x="1120" y="625.5" class="heading">RabbitMQ</text>
<path d="M1320 650V695" class="edge"/>
<rect x="1100" y="695" width="440" height="65" rx="14" fill="#101d38" stroke="#36537c" stroke-width="2"/>
<text x="1120" y="735.5" class="heading">Notification Service</text>
</svg>
