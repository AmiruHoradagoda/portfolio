<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Host Onboarding &amp; Authorization</title><desc id="desc">Application approval grants a role; backend ownership checks define what that role can manage</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#67e8f9"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#e2e8f0;font-size:24px} .title{font-size:38px;font-weight:700;fill:#f8fafc}.sub{fill:#94a3b8;font-size:23px}.label{font-size:21px;fill:#67e8f9;font-weight:700}.heading{font-weight:700;fill:#f8fafc}.edge{fill:none;stroke:#67e8f9;stroke-width:2.5;stroke-linejoin:round;marker-end:url(#arrow)}.dash{stroke-dasharray:7 6}</style>
<rect width="1600" height="900" rx="24" fill="#080d24"/>
<text x="60" y="65" class="title">Host Onboarding &amp; Authorization</text><text x="60" y="105" class="sub">Application approval grants a role; backend ownership checks define what that role can manage</text>
<rect x="60" y="160" width="300" height="65" rx="14" fill="#12304a" stroke="#22d3ee" stroke-width="2"/>
<text x="80" y="200.5" class="heading">CUSTOMER</text>
<path d="M210 225V265" class="edge"/>
<rect x="60" y="265" width="300" height="65" rx="14" fill="#101d38" stroke="#36537c" stroke-width="2"/>
<text x="80" y="305.5" class="heading">Apply as HOST</text>
<path d="M210 330V370" class="edge"/>
<rect x="60" y="370" width="300" height="65" rx="14" fill="#101d38" stroke="#36537c" stroke-width="2"/>
<text x="80" y="410.5" class="heading">PENDING</text>
<path d="M210 435V475" class="edge"/>
<rect x="60" y="475" width="300" height="65" rx="14" fill="#12304a" stroke="#22d3ee" stroke-width="2"/>
<text x="80" y="515.5" class="heading">ADMIN Review</text>
<path d="M360 505H420V195H480" class="edge"/>
<rect x="480" y="160" width="480" height="65" rx="14" fill="#12304a" stroke="#22d3ee" stroke-width="2"/>
<text x="500" y="200.5" class="heading">APPROVED</text>
<path d="M720 225V265" class="edge"/>
<rect x="480" y="265" width="480" height="95" rx="14" fill="#101d38" stroke="#36537c" stroke-width="2"/>
<text x="500" y="305.5" class="heading">Existing Keycloak user</text>
<text x="500" y="335.5">gets HOST role</text>
<path d="M720 360V400" class="edge"/>
<rect x="480" y="400" width="480" height="65" rx="14" fill="#101d38" stroke="#36537c" stroke-width="2"/>
<text x="500" y="440.5" class="heading">Refreshed / new JWT</text>
<path d="M720 465V505" class="edge"/>
<rect x="480" y="505" width="480" height="65" rx="14" fill="#101d38" stroke="#36537c" stroke-width="2"/>
<text x="500" y="545.5" class="heading">HOST dashboard</text>
<path d="M720 570V610" class="edge"/>
<rect x="480" y="610" width="480" height="65" rx="14" fill="#12304a" stroke="#22d3ee" stroke-width="2"/>
<text x="500" y="650.5" class="heading">Manage owned events</text>
<path d="M210 540V635" class="edge"/>
<rect x="60" y="635" width="300" height="110" rx="14" fill="#101d38" stroke="#36537c" stroke-width="2"/>
<text x="80" y="668" class="heading">REJECTED</text>
<text x="80" y="698">Remains normal user</text>
<text x="80" y="728">May reapply</text>
<path d="M60 690H35V295H60" class="edge dash"/>
<rect x="1020" y="160" width="520" height="585" rx="18" fill="#0b142b" stroke="#243958"/>
<text x="1042" y="198" class="label">BACKEND ACCESS BOUNDARIES</text>
<rect x="1050" y="235" width="460" height="95" rx="14" fill="#101d38" stroke="#36537c" stroke-width="2"/>
<text x="1070" y="275.5" class="heading">ADMIN</text>
<text x="1070" y="305.5">All platform management</text>
<rect x="1050" y="375" width="460" height="125" rx="14" fill="#12304a" stroke="#22d3ee" stroke-width="2"/>
<text x="1070" y="415.5" class="heading">HOST</text>
<text x="1070" y="445.5">Own events +</text>
<text x="1070" y="475.5">own event booking scope</text>
<rect x="1050" y="545" width="460" height="125" rx="14" fill="#101d38" stroke="#36537c" stroke-width="2"/>
<text x="1070" y="600.5" class="heading">CUSTOMER</text>
<text x="1070" y="630.5">Public events + own bookings</text>
<text x="60" y="820" class="label">Authorization is enforced by backend role + ownership checks,</text>
<text x="60" y="855" class="sub">not only frontend visibility.</text>
</svg>
