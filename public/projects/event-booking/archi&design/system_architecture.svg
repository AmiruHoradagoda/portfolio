<text x="842" y="588" class="label">SHARED CONFIGURATION &amp; DISCOVERY</text>
<text x="842" y="635">All four application services</text>
<text x="842" y="680">→ Config Server → Git Config Repository</text>
<text x="842" y="755">All four application services → Eureka</text>
<text x="60" y="865" class="sub">Each service accesses its own database; no cross-service database links.</text>
