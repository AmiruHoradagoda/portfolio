<text x="82" y="588" class="label">SERVICE CALLS &amp; INTEGRATIONS</text>
<text x="82" y="635">Auth → Keycloak · AWS S3 · RabbitMQ</text>
<text x="82" y="685">Event → AWS S3</text>
<text x="82" y="735">Booking → Auth Service · Event Service</text>
<text x="82" y="785">Notification → Brevo</text>
